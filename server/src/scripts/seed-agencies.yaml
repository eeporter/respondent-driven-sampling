# Agencies that hand out seed coupons, and the survey site each one's seeds belong to.
# From the "Seed Sites" sheet of Contra Costa Health's Youth Survey Details workbook.
#   name:     agency name, printed (with location) at the top of its coupons and saved on each seed
#   location: where the agency is (city); leave out when there is none
#   site:     hubName of the survey site (see locations.yaml) the seeds are made for
# The same agency can appear twice when it seeds two sites; tell them apart by location.

# West County
- name: 'RYSE'
  location: 'Richmond'
  site: 'San Pablo Library'
- name: 'Calli House'
  location: 'Richmond'
  site: 'San Pablo Library'
- name: 'Hope Solutions (Pomona)'
  location: 'Crockett'
  site: 'San Pablo Library'
- name: 'Contra Costa College-Basic Needs Program'
  location: 'San Pablo'
  site: 'San Pablo Library'

# Central County
- name: 'Rainbow'
  location: 'Concord'
  site: 'Concord Library'
- name: 'Trinity TAY program'
  location: 'Walnut Creek'
  site: 'Concord Library'
- name: 'Diablo Valley College-Basic Needs Program'
  location: 'Pleasant Hill, San Ramon'
  site: 'Concord Library'

# East County
- name: 'Genesis Church'
  location: 'Antioch'
  site: 'Pittsburg Library'
- name: 'Los Medanos College-Basic Needs Program'
  location: 'Pittsburg'
  site: 'Pittsburg Library'
- name: 'Los Medanos College-Basic Needs Program'
  location: 'Brentwood'
  site: 'Brentwood Library'

